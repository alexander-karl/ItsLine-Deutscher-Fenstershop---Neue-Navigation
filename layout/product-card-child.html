<div class="product-card-section">
  <style>
    .product-card-section {
      --product-card-blue: #003d6b;
      font-family: "Inter", Arial, sans-serif;
      color: #2d2d2d;
      background: #fff;
    }

    .product-card-section * {
      box-sizing: border-box;
    }

    .product-card-section .product-card {
      border: 0;
      border-radius: 12px;
      background: #fff;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 518px;
      max-width: 320px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    .product-card-section .product-card-image-wrap {
      padding: 18px;
      min-height: 350px;
      height: 60%;
      display: flex;
      align-items: center;
    }

    .product-card-section .product-card-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    .product-card-section .product-card-head {
      display: block;
    }

    .product-card-section .product-card-category {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
      line-height: 1.2;
      color: #000;
    }

    .product-card-section .product-card-title {
      display: block;
      font-size: 16px;
      line-height: 1.2;
      font-weight: 700;
      color: var(--product-card-blue);
    }

    .product-card-section .product-card-divider {
      display: none;
    }

    .product-card-section .product-card-price {
      margin: 0 0 4px;
      font-size: 14px;
      line-height: 1.2;
      color: #5b5b5b;
    }

    .product-card-section .product-card-price-value {
      font-size: 22px;
      line-height: 1.1;
      font-weight: 700;
      color: #1f1f1f;
      margin-left: 4px;
    }

    .product-card-section .product-card-button {
      margin-top: auto;
      display: block;
      width: 100%;
      text-align: center;
      padding: 12px 16px;
      border-radius: 8px;
      background: #ff6b35;
      border: 2px solid #ff6b35;
      color: #fff;
      font-size: 14px;
      line-height: 18px;
      font-weight: 700;
      text-transform: capitalize;
      transition: all 0.2s ease;
      outline: none;
      text-decoration: none;
    }

    .product-card-section .product-card-button:hover {
      background: #e85a28;
      border-color: #e85a28;
      color: #fff;
      text-decoration: none;
    }

    @media (max-width: 767px) {
      .product-card-section .product-card-image-wrap {
        min-height: 280px;
      }
    }
  </style>

  <article class="product-card">
    <div class="product-card-image-wrap">
      <!-- Динамические данные: URL изображения продукта -->
      <!-- Динамические данные: alt-текст изображения продукта -->
      <img class="product-card-image" src="../assets/images/category-page/product-card.png" alt="Produktbild">
    </div>
    <div class="product-card-head">
      <!-- Динамические данные: название категории -->
      <small class="product-card-category">Kunststofffenster</small>
      <!-- Динамические данные: название товара -->
      <strong class="product-card-title">Drutex Iglo 5 &amp; Iglo 5 Classic</strong>
    </div>
    <div class="product-card-divider"></div>
    <!-- Динамические данные: цена товара -->
    <p class="product-card-price">ab <strong class="product-card-price-value">399 €</strong></p>
    <!-- Динамические данные: ссылка на страницу товара -->
    <!-- Динамические данные: текст кнопки -->
    <a class="product-card-button" href="#">Zum Produkt</a>
  </article>
</div>
